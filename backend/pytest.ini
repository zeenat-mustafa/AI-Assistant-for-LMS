[pytest]
# No pytest config existed in this project before Phase 7.3 — added here
# specifically so tests/adversarial/ (real-Gemini-calling, real-money,
# real-latency tests) is never picked up by a bare `pytest` or `pytest tests/`
# run. norecursedirs only affects recursive discovery: the adversarial suite
# still runs fine when invoked explicitly:
#     cd backend && python -m pytest tests/adversarial -v
norecursedirs = tests/adversarial .git __pycache__ *.egg-info

markers =
    adversarial: real-Gemini-calling tests, excluded from the default suite by norecursedirs above; run explicitly.
